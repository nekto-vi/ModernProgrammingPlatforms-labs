<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="authPanel" class="auth-panel">
        <h1>Вход в список задач</h1>
        <p class="auth-copy">Введите email, чтобы получить одноразовую ссылку для входа или восстановления доступа.</p>
        <form id="requestLinkForm">
            <label class="field-label" for="authEmail">Email</label>
            <input id="authEmail" name="email" class="main-input" type="email" autocomplete="email" required>
            <button class="submit-btn" type="submit">Отправить ссылку</button>
        </form>
        <div id="authMessage" class="error-alert" role="status" aria-live="polite" hidden></div>
    </section>

    <div id="appPanel" hidden>
    <div class="container">
        <div class="identity-bar">
            <div><strong id="currentEmail"></strong><span id="currentRole" class="role-label"></span></div>
            <button id="logoutBtn" class="secondary-btn" type="button">Выйти</button>
        </div>

        <section id="adminPanel" class="management-panel" hidden>
            <h2>Пользователи</h2>
            <form id="inviteForm" class="invite-form">
                <input id="inviteEmail" class="main-input" type="email" placeholder="Email пользователя" required>
                <select id="inviteRole" class="main-input custom-select" aria-label="Роль пользователя">
                    <option value="reader">Читатель</option>
                    <option value="editor">Редактор</option>
                    <option value="admin">Администратор</option>
                </select>
                <button class="secondary-btn" type="submit">Пригласить</button>
            </form>
            <div id="usersList" class="management-list"></div>
        </section>

        <section class="management-panel sessions-panel">
            <details>
                <summary>Активные сессии</summary>
                <div id="sessionsList" class="management-list"></div>
            </details>
        </section>

        <h1>📋 Новая задача</h1>

        <div id="errorMessage" class="error-alert" style="display: none;"></div>

        <form id="taskForm" class="add-card">
            <input type="text" id="titleInput" class="main-input" placeholder="Название новой задачи..." required>
            
            <input type="text" id="commentInput" class="main-input" placeholder="Комментарий к задаче (необязательно)...">

            <div class="form-grid">
                <div class="input-group">
                    <label class="field-label">Срок выполнения</label>
                    <input type="date" id="dateInput" required>
                </div>
                
                <div class="input-group">
                    <label class="field-label">Прикрепить файл</label>
                    <div class="file-upload-container">
                        <input type="file" id="fileInput" class="hidden-file-input" onchange="handleFileSelect(this)">
                        
                        <label for="fileInput" class="custom-file-label" id="filePlaceholder">
                            <span>📎 Выбрать файл</span>
                        </label>

                        <div id="fileInfo" class="selected-file-info">
                            <span class="file-name-text" id="fileName"></span>
                            <button type="button" class="remove-file-btn" onclick="clearFileSelection()">×</button>
                        </div>
                    </div>
                </div>
            </div> 
            
            <button type="submit" class="submit-btn" id="submitBtn">Создать задачу</button>
        </form>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." class="main-input" oninput="fetchTasks()">
            
            <select id="sortSelect" class="main-input custom-select" onchange="fetchTasks()">
                <option value="created">Сначала новые</option>
                <option value="oldest">Сначала старые</option>
                <option value="date_asc">По дедлайну (ближайшие)</option>
            </select>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="todo">Активные</button>
            <button class="filter-btn" data-filter="done">Выполненные</button>
        </div>

        <div id="taskList" class="task-list">
            <div style="text-align:center; color: gray;">Загрузка задач...</div>
        </div>
    </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
